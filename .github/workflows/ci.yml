name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  integration:
    name: Integration (Postgres via testcontainers)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma test client
        run: pnpm --filter @stateledger/prisma prisma:generate

      - name: Build
        run: pnpm build

      # Every adapter runs the shared contract suite plus its own edge cases
      # against a real Postgres. A suite that is not listed here does not run,
      # and a suite that does not run is a suite that rots: the drizzle
      # adapter shipped a broken `stateAt()` on postgres.js for two releases
      # because only one of its two supported drivers was ever exercised.
      # Adding an adapter means adding a step here.
      - name: Prisma adapter — integration
        run: pnpm --filter @stateledger/prisma test:integration

      - name: Drizzle adapter — integration
        run: pnpm --filter @stateledger/drizzle test:integration

      - name: pg adapter — integration
        run: pnpm --filter @stateledger/pg test:integration

      - name: Kysely adapter — integration
        run: pnpm --filter @stateledger/kysely test:integration

      - name: TypeORM adapter — integration
        run: pnpm --filter @stateledger/typeorm test:integration

      - name: Outbox — integration
        run: pnpm --filter @stateledger/outbox test:integration
